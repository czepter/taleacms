# Kaleta + MariaDB. Copy .env.example to .env, set the passwords, then: docker compose up -d --build
# Every KALETA_* variable from .env reaches the containers as is (list: docker/README.md).

services:
  web:
    build: .
    image: kaleta
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"] # behind a TLS proxy; the Caddyfile trusts X-Forwarded-* from private addresses
    env_file: .env
    volumes: [storage:/app/storage, media:/app/media, extensions:/app/extensions]
    depends_on:
      db: {condition: service_healthy}

  # background jobs (scheduled news, newsletters, backups, reminders): the container equivalent of the cron address /ulohy
  cron:
    image: kaleta
    restart: unless-stopped
    command: ["sh", "-c", "while true; do php system/docker.php cron; sleep 300; done"]
    env_file: .env
    volumes: [storage:/app/storage, media:/app/media, extensions:/app/extensions]
    depends_on: [web]

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${KALETA_DB_NAME}
      MARIADB_USER: ${KALETA_DB_USER}
      MARIADB_PASSWORD: ${KALETA_DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes: [db:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

volumes:
  db:
  storage:
  media:
  extensions:
