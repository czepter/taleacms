# Kaleta + MariaDB. Copy .env.example to .env, set the passwords, then: docker compose up -d --build
x-kaleta-env: &kaleta-env
  KALETA_DB_HOST: db
  KALETA_DB_NAME: kaleta
  KALETA_DB_USER: kaleta
  KALETA_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  KALETA_SITE_URL: ${SITE_URL:-http://localhost:8080}
  KALETA_SITE_NAME: ${SITE_NAME:-My website}
  KALETA_LANGUAGE: ${LANGUAGE:-en}
  KALETA_ADMIN_USER: ${ADMIN_USER:-admin}
  KALETA_ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  KALETA_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env (min. 10 characters)}

services:
  web:
    build: .
    image: kaleta
    restart: unless-stopped
    ports: ["8080:8080"]
    environment: *kaleta-env
    volumes: [storage:/app/storage, media:/app/media, extensions:/app/extensions]
    depends_on:
      db: {condition: service_healthy}

  # background jobs (scheduled news, newsletters, backups, reminders): the container equivalent of the cron address /ulohy
  cron:
    image: kaleta
    restart: unless-stopped
    command: ["sh", "-c", "while true; do php system/docker.php cron; sleep 300; done"]
    environment: *kaleta-env
    volumes: [storage:/app/storage, media:/app/media, extensions:/app/extensions]
    depends_on: [web]

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: kaleta
      MARIADB_USER: kaleta
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes: [db:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

volumes:
  db:
  storage:
  media:
  extensions:
