# Gitleaks: výchozí pravidla + výjimka pro smyšlené klíče, kterými testy krmí falešný server Stripe (tools/test.sh, tools/fixtures/).
# Skutečný klíč sem nikdy nepatří – výjimka je úmyslně jen na tento jeden vymyšlený řetězec.
title = "Kaleta"

[extend]
useDefault = true

[allowlist]
description = "made-up test values: a Stripe key for the offline tests, the public TOTP test vector of RFC 6238, the demo test password (tools/test-demo.sh)"
regexes = ['''sk_test_NahrazkaKlice0+''', '''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''', '''Demo-kaleta-2026''']
