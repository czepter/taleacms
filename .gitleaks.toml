# Gitleaks: default rules, except for the made-up values that the tests and fixtures feed to the application (wrong passwords, fake
# provider keys, RFC 6238 test vectors). A real key never belongs in these either; everything else is scanned.
title = "Talea"

[extend]
useDefault = true

[allowlist]
description = "made-up test values in tests/, tools/fixtures/ and the test harness scripts (including their history)"
paths = ['''^tests/''', '''^tools/fixtures/''', '''^tools/(test|test-demo|unit-tests)\.(sh|php)$''']
