expose_php = Off
memory_limit = 256M
; a whole-site export (Import and export) carries the media library and easily exceeds 64 MB; the body is streamed to a temporary file, not into memory
upload_max_filesize = 2G
post_max_size = 2G
max_execution_time = 60
display_errors = Off
log_errors = On
error_log = /dev/stderr
; the files are part of the image and never change (an update is a new image)
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
