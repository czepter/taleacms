; development only (stage "dev" of the Dockerfile): code is mounted from the host and changes on every save
display_errors = On
error_reporting = E_ALL
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
; Xdebug is installed but off; XDEBUG_MODE=debug docker compose -f docker-compose-dev.yaml up -d turns it on (IDE listens on 9003)
xdebug.client_host = host.docker.internal
xdebug.start_with_request = yes
xdebug.discover_client_host = 0
