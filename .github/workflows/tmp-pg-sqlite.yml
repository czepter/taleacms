# TEMPORARY: verifies the release fixes for PostgreSQL and SQLite; removed before the branch is finished.
name: tmp-pg-sqlite
on:
  push:
    branches: [fix/release-pg-sqlite]
permissions:
  contents: read
  actions: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      db:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432']
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/php-composer
      - name: PHPUnit on PostgreSQL (integration and whole installed sites)
        run: vendor/bin/paratest --processes 4 --testsuite integration,site
        env: { TALEA_TEST_DB_DRIVER: pgsql, TALEA_CI_NETWORK: "${{ job.services.db.network }}", TALEA_TEST_PG_HOST: db, TALEA_TEST_PG_PORT: 5432, TALEA_TEST_PG_USER: postgres, TALEA_TEST_PG_PASSWORD: postgres }
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/php-composer
      - name: PHPUnit on SQLite (integration and whole installed sites)
        run: vendor/bin/paratest --processes 4 --testsuite integration,site
        env: { TALEA_TEST_DB_DRIVER: sqlite }
  mysql-changed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root }
        ports: ['3306']
        options: --tmpfs /var/lib/mysql --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/php-composer
      - name: PHPUnit on MySQL (the changed classes only)
        run: vendor/bin/phpunit --testsuite integration --filter '/(SiteRoundTripTest|StarterPagesTest|SealedSecretsTest)/'
        env: { TALEA_CI_NETWORK: "${{ job.services.db.network }}", TALEA_TEST_DB_HOST: db, TALEA_TEST_DB_PORT: 3306, TALEA_TEST_DB_USER: root, TALEA_TEST_DB_PASSWORD: root }
