# Release: a tag vX.Y.Z runs the tests, builds and pushes the multi-arch container image to GHCR, signs it with cosign (keyless,
# GitHub OIDC) and creates a DRAFT release. The release feed (update.json) is signed by the publisher on their own computer, never here:
#   php tools/release.php X.Y.Z --feed --image=ghcr.io/<owner>/talea:X.Y.Z --digest=sha256:<digest printed by this job> --change="…"
# then upload dist/update.json to the draft as the asset update.json and publish it (docs/RELEASING.md, docs/DEPLOYMENT.md).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root }
        ports: ['3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { fetch-depth: 0 }
      - name: Version in the code matches the tag
        run: grep -q "const TALEA_VERSION = '${GITHUB_REF_NAME#v}';" system/bootstrap.php
      - uses: ./.github/actions/php-composer
      - name: Tests
        env: { TALEA_TEST_DB_HOST: 127.0.0.1, TALEA_TEST_DB_PORT: "${{ job.services.mysql.ports['3306'] }}", TALEA_TEST_DB_USER: root, TALEA_TEST_DB_PASSWORD: root }
        run: vendor/bin/paratest --processes 4 --exclude-group browser --exclude-group e2e

  image:
    needs: test
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/talea
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign the image (keyless)
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/talea@${{ steps.build.outputs.digest }}
      - name: Digest for the signed feed
        run: echo "image digest ${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"

  draft:
    needs: image
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with: { draft: true, generate_release_notes: true }
