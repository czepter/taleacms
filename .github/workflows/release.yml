# Container images (docs/RELEASING.md). A tag vX.Y.Z (or a pre-release vX.Y.Z-rc.N) builds the release image: tests unless CI already
# passed for the tagged commit, the multi-arch image to GHCR with the tags of tools/image-tags.sh, a cosign signature (keyless, GitHub
# OIDC) and the GitHub release with generated notes. Every push to main that passed CI builds the image `edge` (and `sha-<commit>`)
# the same way, without a release.
# Each architecture builds natively: amd64 on the self-hosted runners, arm64 on a GitHub-hosted arm64 runner; the job image joins them.
# Cache: amd64 keeps one BuildKit builder on the runner host (talea-release) with every layer and the apt and Composer cache mounts
# between runs; arm64 starts a fresh builder each run. The registry cache talea-buildcache:main-<arch> fills a builder that is new.
# A code change rebuilds only the last COPY layers.
name: Release

on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write
  id-token: write
  actions: read

concurrency:
  # one run per tag; edge builds replace each other, only the newest main matters
  group: release-${{ github.event_name == 'push' && github.ref || 'edge' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

jobs:
  test:
    # edge: only after a successful CI run of a push to main in this repository (a fork's pull request from its own "main" also
    # completes CI, and its code must never reach the registry)
    if: >-
      github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    outputs:
      stale: ${{ steps.gate.outputs.stale }}
    services:
      db:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root }
        ports: ['3306']
        options: --tmpfs /var/lib/mysql --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - id: gate
        name: Already tested? (CI passed for this content)
        # edge builds github.sha, the head of main now, never a ref from the event: when main has moved past the tested commit,
        # the newer commit gets its own edge build after its own CI run
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$TESTED" ] && [ "$TESTED" != "$SHA" ]; then
            echo "main moved on from $TESTED to $SHA: no edge build for the older commit"; echo "stale=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # CI already passed for this content: the commit itself, a parent with the same tree (the merge commit of an up-to-date
          # pull request, whose head was tested), or a tested parent it differs from only in the TALEA_VERSION line (a release bump:
          # the version is no code). A run counts only when the named job succeeded: the run of a fork's pull request skips every
          # job. Any API error: not tested. The same function is in ci.yml.
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$1"; }
          version_only() {
            api "compare/$1...$2" | jq -e --arg re "^[-+]const TALEA_VERSION = '[^']+';\$" '.status == "ahead" and (.files | length) == 1
              and .files[0].filename == "system/bootstrap.php"
              and ([.files[0].patch | split("\n")[] | select(startswith("+") or startswith("-"))] | length > 0 and all(test($re)))' >/dev/null
          }
          tested() {
            local commit tree c run by
            commit=$(api "commits/$1") || return 1
            tree=$(jq -r .commit.tree.sha <<<"$commit")
            for c in "$1" $(jq -r '.parents[].sha' <<<"$commit"); do
              if [ "$c" != "$1" ] && [ "$(api "commits/$c" | jq -r .commit.tree.sha)" != "$tree" ]; then
                [ -z "$3" ] && version_only "$c" "$1" && by=$(tested "$c" "$2" bump) && { echo "$by"; return 0; }
                continue
              fi
              for run in $(api "actions/workflows/ci.yml/runs?head_sha=$c&status=success&per_page=5" | jq -r '.workflow_runs[].id'); do
                api "actions/runs/$run/jobs?per_page=50" | jq -e --arg job "$2" '.jobs[] | select(.name == $job and .conclusion == "success")' >/dev/null \
                  && { echo "$c"; return 0; }
              done
            done
            return 1
          }
          if by=$(tested "$SHA" 'Tests on MySQL 8.4'); then echo "CI passed for the content of $SHA (at $by): the tests are not run again"; echo "tested=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.tested != 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - if: steps.gate.outputs.tested != 'true'
        uses: ./.github/actions/php-composer
      - if: steps.gate.outputs.tested != 'true'
        name: PHPUnit (unit, integration and whole installed sites)
        run: vendor/bin/paratest --processes 4 --testsuite unit,integration,site
        env: { TALEA_CI_NETWORK: "${{ job.services.db.network }}", TALEA_TEST_DB_HOST: db, TALEA_TEST_DB_PORT: 3306, TALEA_TEST_DB_USER: root, TALEA_TEST_DB_PASSWORD: root }

  meta:
    needs: test
    if: needs.test.outputs.stale != 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    outputs:
      image: ${{ steps.tags.outputs.image }}
      version: ${{ steps.tags.outputs.version }}
      sha: ${{ steps.tags.outputs.sha }}
      latest: ${{ steps.tags.outputs.latest }}
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { fetch-depth: 0 }
      - id: tags
        name: Version and image tags
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/talea"
          code=$(sed -nE "s/^const TALEA_VERSION = '([^']+)';/\1/p" system/bootstrap.php)
          if [ "$EVENT" = push ]; then
            version=${GITHUB_REF_NAME#v}
            [ "$version" = "$code" ] || { echo "::error::tag $GITHUB_REF_NAME, but TALEA_VERSION in system/bootstrap.php is $code"; exit 1; }
            tags=$(git tag -l 'v*' | tools/image-tags.sh "$version")
          else
            version=edge
            tags=$(printf 'edge\nsha-%s\n' "${SHA:0:7}")
          fi
          # shellcheck disable=SC2001
          tags=$(sed "s|^|$image:|" <<<"$tags")
          latest=false; grep -qx "$image:latest" <<<"$tags" && latest=true
          printf 'image=%s\nversion=%s\nsha=%s\nlatest=%s\ntags<<EOF\n%s\nEOF\n' "$image" "$version" "$SHA" "$latest" "$tags" >> "$GITHUB_OUTPUT"
          echo "$tags"

  build:
    # one native build per architecture, pushed by digest only; the job image puts them under one index with the tags.
    # arm64 runs on a GitHub-hosted arm64 runner (free for a public repository): no QEMU, and no load on the self-hosted host
    needs: meta
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: '["self-hosted", "Linux", "X64"]', builder: talea-release }
          - { arch: arm64, runner: '"ubuntu-24.04-arm"', builder: '' }
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # self-hosted: one builder per runner host, kept after the job: its state is the layer cache, shared by the runners on
          # the host. Hosted: a fresh builder per run, filled from the registry cache
          name: ${{ matrix.builder }}
          cleanup: ${{ matrix.builder == '' }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # named, not "the current builder": the runners on the host share one buildx config, and another job can switch it back
          # to the docker driver, which cannot push by digest
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: production
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ needs.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=Talea
            org.opencontainers.image.description=Self-hosted website builder
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-2.0-or-later
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ needs.meta.outputs.sha }}
          # every layer of the architecture (mode=max), for a builder that starts empty; the builder's own state comes first
          cache-from: type=registry,ref=${{ needs.meta.outputs.image }}-buildcache:main-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ needs.meta.outputs.image }}-buildcache:main-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true
          provenance: true
          sbom: true
      - name: Keep the digest for the index
        env: { DIGEST: '${{ steps.build.outputs.digest }}' }
        run: mkdir -p "$RUNNER_TEMP/digests" && touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: 'digest-${{ matrix.arch }}', path: '${{ runner.temp }}/digests/*', retention-days: 1 }

  image:
    needs: [meta, build]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    outputs:
      image: ${{ needs.meta.outputs.image }}
      version: ${{ needs.meta.outputs.version }}
      latest: ${{ needs.meta.outputs.latest }}
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: 'digest-*', merge-multiple: true, path: '${{ runner.temp }}/digests' }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: index
        name: Tag both architectures under one index
        # GHCR reads the description and the repository of a multi-arch image from the index
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
          TAGS: ${{ needs.meta.outputs.tags }}
          VERSION: ${{ needs.meta.outputs.version }}
          SHA: ${{ needs.meta.outputs.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          args=()
          while read -r tag; do args+=(-t "$tag"); done <<<"$TAGS"
          for digest in "$RUNNER_TEMP"/digests/*; do args+=("$IMAGE@sha256:${digest##*/}"); done
          docker buildx imagetools create "${args[@]}" \
            --annotation "index:org.opencontainers.image.description=Self-hosted website builder" \
            --annotation "index:org.opencontainers.image.source=$SOURCE" \
            --annotation "index:org.opencontainers.image.licenses=GPL-2.0-or-later" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=$SHA"
          digest=$(docker buildx imagetools inspect "$(head -n1 <<<"$TAGS")" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign the image (keyless) and print its digest
        env: { IMAGE: '${{ needs.meta.outputs.image }}', DIGEST: '${{ steps.index.outputs.digest }}', TAGS: '${{ needs.meta.outputs.tags }}' }
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          { echo "image digest $DIGEST"; echo; echo '```'; echo "$TAGS"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    needs: image
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          # GitHub's "latest release" follows the image tag latest: a patch of an older line does not take it
          make_latest: ${{ needs.image.outputs.latest }}
          generate_release_notes: true
          body: |
            ```
            docker pull ${{ needs.image.outputs.image }}:${{ needs.image.outputs.version }}
            ```
            Digest `${{ needs.image.outputs.digest }}`, signed with cosign (docs/DEPLOYMENT.md, "Verify an image").
