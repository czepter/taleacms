# Release: a tag vX.Y.Z runs the tests and creates a DRAFT release on GitHub.
# The package is not signed here - the private key does not belong in CI (docs/RELEASING.md). The publisher then runs locally
#   php tools/release.php X.Y.Z --url=https://github.com/phprs-cms/kaletacms/releases/download/vX.Y.Z/kaleta-X.Y.Z.zip --zmena="…"
# uploads dist/kaleta-X.Y.Z.zip to the draft (gh release upload vX.Y.Z dist/kaleta-X.Y.Z.zip), publishes the draft
# and serves dist/aktualizace.json at https://kaletacms.com/aktualizace.json.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root }
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with: { php-version: '8.4', extensions: 'pdo_mysql, mbstring, gd, intl, zip, sodium', coverage: none }
      - name: Version in the code matches the tag
        run: grep -q "const KALETA_VERSION = '${GITHUB_REF_NAME#v}';" system/bootstrap.php
      - uses: ramsey/composer-install@3cf229dc2919194e9e36783941438d17239e8520 # v3
      - name: Tests
        env: { KALETA_TEST_DB_HOST: 127.0.0.1, KALETA_TEST_DB_PORT: 3306, KALETA_TEST_DB_USER: root, KALETA_TEST_DB_PASSWORD: root }
        run: vendor/bin/paratest --processes 4
      - name: Draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with: { draft: true, generate_release_notes: true }
