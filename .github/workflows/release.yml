# Container images (docs/RELEASING.md). A tag vX.Y.Z (or a pre-release vX.Y.Z-rc.N) builds the release image: tests unless CI already
# passed for the tagged commit, the multi-arch image to GHCR with the tags of tools/image-tags.sh, a cosign signature (keyless, GitHub
# OIDC) and a DRAFT release. Every push to main that passed CI builds the image `edge` (and `sha-<commit>`) the same way.
# The release feed (update.json) is signed by the publisher on their own computer, never here:
#   php tools/release.php X.Y.Z --feed --image=ghcr.io/<owner>/talea:X.Y.Z --digest=sha256:<digest in the draft and the job summary> --change="…"
# then upload dist/update.json to the draft as the asset update.json and publish it (docs/RELEASING.md, docs/DEPLOYMENT.md).
# Cache: one BuildKit builder kept on the runner host (talea-release) holds every layer and the apt and Composer cache mounts between
# runs; the registry cache talea-buildcache refills it when the builder is new. A code change rebuilds only the last COPY layers.
name: Release

on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write
  id-token: write
  actions: read

concurrency:
  # one run per tag; edge builds replace each other, only the newest main matters
  group: release-${{ github.event_name == 'push' && github.ref || 'edge' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

jobs:
  test:
    # edge: only after a successful CI run of a push to main in this repository (a fork's pull request from its own "main" also
    # completes CI, and its code must never reach the registry)
    if: >-
      github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    services:
      db:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root }
        ports: ['3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - id: gate
        name: Already tested? (a successful CI run of a push of this commit)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          n=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=success&per_page=1" \
            | jq -r '.total_count' 2>/dev/null || echo 0)
          if [ "${n:-0}" -gt 0 ]; then echo "CI passed for $SHA: the tests are not run again"; echo "tested=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.tested != 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - if: steps.gate.outputs.tested != 'true'
        uses: ./.github/actions/php-composer
      - if: steps.gate.outputs.tested != 'true'
        name: PHPUnit (unit, integration and whole installed sites)
        run: vendor/bin/paratest --processes 4 --testsuite unit,integration,site
        env: { TALEA_CI_NETWORK: "${{ job.services.db.network }}", TALEA_TEST_DB_HOST: db, TALEA_TEST_DB_PORT: 3306, TALEA_TEST_DB_USER: root, TALEA_TEST_DB_PASSWORD: root }

  image:
    needs: test
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    outputs:
      image: ${{ steps.tags.outputs.image }}
      version: ${{ steps.tags.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { ref: '${{ github.event.workflow_run.head_sha }}', fetch-depth: 0 }
      - id: tags
        name: Version and image tags
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/talea"
          code=$(sed -nE "s/^const TALEA_VERSION = '([^']+)';/\1/p" system/bootstrap.php)
          if [ "$EVENT" = push ]; then
            version=${GITHUB_REF_NAME#v}
            [ "$version" = "$code" ] || { echo "::error::tag $GITHUB_REF_NAME, but TALEA_VERSION in system/bootstrap.php is $code"; exit 1; }
            tags=$(git tag -l 'v*' | tools/image-tags.sh "$version")
          else
            version=edge
            tags=$(printf 'edge\nsha-%s\n' "${SHA:0:7}")
          fi
          # shellcheck disable=SC2001
          tags=$(sed "s|^|$image:|" <<<"$tags")
          printf 'image=%s\nversion=%s\nsha=%s\ntags<<EOF\n%s\nEOF\n' "$image" "$version" "$SHA" "$tags" >> "$GITHUB_OUTPUT"
          echo "$tags"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # one builder per runner host, kept after the job: its state is the layer cache, shared by the runners on the host
          name: talea-release
          cleanup: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Talea
            org.opencontainers.image.description=Self-hosted website builder
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-2.0-or-later
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ steps.tags.outputs.sha }}
          # GHCR reads the description and the repository of a multi-arch image from the index
          annotations: |
            index:org.opencontainers.image.description=Self-hosted website builder
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.licenses=GPL-2.0-or-later
            index:org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            index:org.opencontainers.image.revision=${{ steps.tags.outputs.sha }}
          # every layer of both architectures (mode=max), for a builder that starts empty; the builder's own state comes first
          cache-from: type=registry,ref=${{ steps.tags.outputs.image }}-buildcache:main
          cache-to: type=registry,ref=${{ steps.tags.outputs.image }}-buildcache:main,mode=max,image-manifest=true,oci-mediatypes=true
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign the image (keyless) and print its digest for the signed feed
        env: { IMAGE: '${{ steps.tags.outputs.image }}', DIGEST: '${{ steps.build.outputs.digest }}', TAGS: '${{ steps.tags.outputs.tags }}' }
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          { echo "image digest $DIGEST"; echo; echo '```'; echo "$TAGS"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

  draft:
    needs: image
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            Image: `${{ needs.image.outputs.image }}:${{ needs.image.outputs.version }}` (digest `${{ needs.image.outputs.digest }}`, signed with cosign)

            Feed: `php tools/release.php ${{ needs.image.outputs.version }} --feed --image=${{ needs.image.outputs.image }}:${{ needs.image.outputs.version }} --digest=${{ needs.image.outputs.digest }} --change="…"`
