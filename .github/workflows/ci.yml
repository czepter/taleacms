# Checks every change on PHP 8.5, the version the container image (FrankenPHP) runs: the repository's own checks, the PHPUnit suites
# on MySQL 8.4 and on PostgreSQL 18, the browser walk, static analysis and security scanning.
name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Content that already passed CI runs nothing again: a pull request whose head passed (dev -> main after the push to dev), the
  # merge commit of an up-to-date pull request (same tree as the tested head), or a release bump (only the TALEA_VERSION line
  # differs from a tested parent). Anything else, and any doubt (API error), runs everything.
  # A change of documentation only (Markdown, docs/ apart from the add-on examples the tests install, NOTICE, LICENSE, and the
  # docker-compose*.yaml files, release.yml and pages.yml, which CI never reads) skips the test jobs (output tests=false, browser=false); a change of
  # stylesheets (with or without documentation) runs the browser walk
  # but not the database suites and static analysis (tests=false). The repository checks (unit suite) and the security scan still run.
  gate:
    name: Not tested yet
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
      tests: ${{ steps.gate.outputs.tests }}
      browser: ${{ steps.gate.outputs.browser }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR: ${{ github.event.pull_request.number }}
          PR_FILES: ${{ github.event.pull_request.changed_files }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # CI already passed for this content: the commit itself, a parent with the same tree (the merge commit of an up-to-date
          # pull request, whose head was tested), or a tested parent it differs from only in the TALEA_VERSION line (a release bump:
          # the version is no code). A run counts only when the named job succeeded: the run of a fork's pull request skips every
          # job. Any API error: not tested. The same function is in release.yml.
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$1"; }
          version_only() {
            api "compare/$1...$2" | jq -e --arg re "^[-+]const TALEA_VERSION = '[^']+';\$" '.status == "ahead" and (.files | length) == 1
              and .files[0].filename == "system/bootstrap.php"
              and ([.files[0].patch | split("\n")[] | select(startswith("+") or startswith("-"))] | length > 0 and all(test($re)))' >/dev/null
          }
          tested() {
            local commit tree c run by
            commit=$(api "commits/$1") || return 1
            tree=$(jq -r .commit.tree.sha <<<"$commit")
            for c in "$1" $(jq -r '.parents[].sha' <<<"$commit"); do
              if [ "$c" != "$1" ] && [ "$(api "commits/$c" | jq -r .commit.tree.sha)" != "$tree" ]; then
                [ -z "$3" ] && version_only "$c" "$1" && by=$(tested "$c" "$2" bump) && { echo "$by"; return 0; }
                continue
              fi
              for run in $(api "actions/workflows/ci.yml/runs?head_sha=$c&status=success&per_page=5" | jq -r '.workflow_runs[].id'); do
                api "actions/runs/$run/jobs?per_page=50" | jq -e --arg job "$2" '.jobs[] | select(.name == $job and .conclusion == "success")' >/dev/null \
                  && { echo "$c"; return 0; }
              done
            done
            return 1
          }
          run=true
          # a fork's pull request must never run on the self-hosted runners
          if [ "$EVENT" = pull_request ] && [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            run=false; echo "pull request from a fork: not run on self-hosted runners"
          elif by=$(tested "${SHA:-$AFTER}" 'Repository checks'); then
            run=false; echo "the content of ${SHA:-$AFTER} already passed CI at $by: nothing runs again"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

          # the changed files from the API (no checkout here); more than 300, an API error or another event: unknown, so tests run
          set -o pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          files=""
          if [ "$EVENT" = pull_request ] && [ "${PR_FILES:-0}" -gt 0 ] && [ "${PR_FILES:-0}" -le 300 ]; then
            for page in 1 2 3; do
              files+=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$api/pulls/$PR/files?per_page=100&page=$page" | jq -r '.[].filename')$'\n' \
                || { files=""; break; }
            done
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "${BEFORE//0/}" != "" ]; then
            files=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$api/compare/$BEFORE...$AFTER" \
              | jq -r 'if (.files | length) < 300 then .files[].filename else empty end') || files=""
          fi
          tests=true; browser=true
          code=$(grep -v -E '(\.md$|^docs/|^NOTICE$|^LICENSE$|^docker-compose[^/]*\.yaml$|^\.github/workflows/(release|pages)\.yml$)' <<<"$files" || true)
          if grep -q . <<<"$files" && ! grep -q '^docs/examples/' <<<"$files"; then
            if ! grep -q . <<<"$code"; then
              tests=false; browser=false; echo "documentation only: the test jobs are skipped"
            elif ! grep -qv '\.css$' <<<"$code"; then
              tests=false; echo "stylesheets only: of the test jobs only the browser walk runs (it finds content that spills out of its box)"
            fi
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "browser=$browser" >> "$GITHUB_OUTPUT"
  checks:
    name: Repository checks
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/php-composer
      - name: PHPUnit unit suite (no database, so it runs here once and not in every database job)
        # it checks the public contracts (ContractsTest); tools/check-english.php and tools/sql-dialect-scan.php
        # are developer tools, run locally, not here
        run: vendor/bin/phpunit --testsuite unit

  mysql:
    name: Tests on MySQL 8.4
    needs: gate
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.tests == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    # the data directory lives in memory (--tmpfs): every test class installs and drops whole sites, and on disk each commit and
    # each CREATE/DROP TABLE waited for fsync – the suite took 18 minutes against 5 on PostgreSQL. The test data is thrown away anyway.
    services:
      db:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root }
        ports: ['3306']
        options: --tmpfs /var/lib/mysql --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/php-composer
      - name: PHPUnit (integration and whole installed sites; the unit suite runs in Repository checks)
        run: vendor/bin/paratest --processes 4 --testsuite integration,site
        env: { TALEA_CI_NETWORK: "${{ job.services.db.network }}", TALEA_TEST_DB_HOST: db, TALEA_TEST_DB_PORT: 3306, TALEA_TEST_DB_USER: root, TALEA_TEST_DB_PASSWORD: root }

  postgres:
    name: Tests on PostgreSQL 18
    needs: gate
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.tests == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    services:
      db:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432']
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/php-composer
      - name: PHPUnit (integration and whole installed sites)
        run: vendor/bin/paratest --processes 4 --testsuite integration,site
        env: { TALEA_TEST_DB_DRIVER: pgsql, TALEA_CI_NETWORK: "${{ job.services.db.network }}", TALEA_TEST_PG_HOST: db, TALEA_TEST_PG_PORT: 5432, TALEA_TEST_PG_USER: postgres, TALEA_TEST_PG_PASSWORD: postgres }

  browser:
    name: Browser walk (Chrome)
    needs: gate
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.browser == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    services:
      db:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root }
        ports: ['3306']
        options: --tmpfs /var/lib/mysql --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/php-composer
      - name: Admin, builder, editors and public site in Chrome
        # Chromium and Node live in the ci image (.github/actions/php-composer): the path is the one inside the container
        run: vendor/bin/phpunit --testsuite browser
        env: { CHROME: /usr/bin/chromium, TALEA_CI_NETWORK: "${{ job.services.db.network }}", TALEA_TEST_DB_HOST: db, TALEA_TEST_DB_PORT: 3306, TALEA_TEST_DB_USER: root, TALEA_TEST_DB_PASSWORD: root }

  phpstan:
    # static analysis (phpstan.neon.dist): level 5, the existing findings in phpstan-baseline.neon - new code adds none
    name: Static analysis
    needs: gate
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.tests == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/php-composer
      - name: PHPStan
        run: |
          # RUNNER_TEMP, not /tmp: PHP runs in a container that sees only the workspace and RUNNER_TEMP
          curl -sSL -o "$RUNNER_TEMP/phpstan.phar" https://github.com/phpstan/phpstan/releases/download/2.1.30/phpstan.phar
          # two worker processes, not one per CPU: each worker can take as much memory as the main process, and together they ran
          # the shared runner host out of memory; one process needs about 500 MB, so two fit the container's cap (php-composer)
          printf 'includes:\n    - %s/phpstan.neon.dist\nparameters:\n    parallel:\n        maximumNumberOfProcesses: 2\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/phpstan-ci.neon"
          php "$RUNNER_TEMP/phpstan.phar" analyse -c "$RUNNER_TEMP/phpstan-ci.neon" --no-progress

  security:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { fetch-depth: 0 }
      - name: Semgrep - security rules for PHP and JavaScript
        # run the tool directly in a container: the deprecated semgrep-action can no longer read the current registry rules
        run: docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep semgrep scan --config p/php --config p/javascript --config p/secrets --config p/owasp-top-ten --error --metrics=off --quiet
      - name: Gitleaks - no keys or passwords in the repository
        # run the tool directly: the gitleaks-action wrapper needs a paid licence for organisations
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source /repo --redact --no-banner --verbose
