# Checks every change on PHP 8.5, the version the container image (FrankenPHP) runs: the repository's own checks, the PHPUnit suites
# on MySQL 8.4 and on PostgreSQL 18, the browser walk, static analysis and security scanning. Also runs once a week without changes.
name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # A pull request dev -> main whose head commit already passed CI (the push to dev) would run every job a second time on the
  # same code: this gate skips them. Anything else, and any doubt (API error), runs everything.
  # A change of documentation only (Markdown, docs/ apart from the add-on examples the tests install, NOTICE, LICENSE) skips the
  # test jobs (output tests=false); the repository checks (English, contracts) and the security scan still run.
  gate:
    name: Not tested yet
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
      tests: ${{ steps.gate.outputs.tests }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR: ${{ github.event.pull_request.number }}
          PR_FILES: ${{ github.event.pull_request.changed_files }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          run=true
          # a fork's pull request must never run on the self-hosted runners
          if [ "$EVENT" = pull_request ] && [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            run=false; echo "pull request from a fork: not run on self-hosted runners"
          elif [ "$EVENT" = pull_request ] && [ "$BASE" = main ] && [ "$HEAD" = dev ]; then
            n=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=success&per_page=1" \
              | jq -r '.total_count' 2>/dev/null || echo 0)
            [ "${n:-0}" -gt 0 ] && run=false && echo "dev at $SHA already passed CI: skipping the duplicate run"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

          # the changed files from the API (no checkout here); more than 300, an API error or another event: unknown, so tests run
          set -o pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          files=""
          if [ "$EVENT" = pull_request ] && [ "${PR_FILES:-0}" -gt 0 ] && [ "${PR_FILES:-0}" -le 300 ]; then
            for page in 1 2 3; do
              files+=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$api/pulls/$PR/files?per_page=100&page=$page" | jq -r '.[].filename')$'\n' \
                || { files=""; break; }
            done
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "${BEFORE//0/}" != "" ]; then
            files=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$api/compare/$BEFORE...$AFTER" \
              | jq -r 'if (.files | length) < 300 then .files[].filename else empty end') || files=""
          fi
          tests=true
          if grep -q . <<<"$files" && ! grep -v -E '(\.md$|^docs/|^NOTICE$|^LICENSE$)' <<<"$files" | grep -q . \
            && ! grep -q '^docs/examples/' <<<"$files"; then
            tests=false; echo "documentation only: the test jobs are skipped"
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
  checks:
    name: Repository checks
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/php-composer
      - run: php tools/check-english.php
      - run: php tools/contracts.php
      - run: php tools/sql-dialect-scan.php
      - run: php tools/unit-tests.php
      - name: PHPUnit unit suite (no database, so it runs here once and not in every database job)
        run: vendor/bin/phpunit --testsuite unit

  mysql:
    name: Tests on MySQL 8.4
    needs: gate
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.tests == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    services:
      db:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root }
        ports: ['3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/php-composer
      - name: PHPUnit (integration and whole installed sites; the unit suite and tools/unit-tests.php run in Repository checks)
        run: vendor/bin/paratest --processes 4 --testsuite integration,site
        env: { TALEA_CI_NETWORK: "${{ job.services.db.network }}", TALEA_TEST_DB_HOST: db, TALEA_TEST_DB_PORT: 3306, TALEA_TEST_DB_USER: root, TALEA_TEST_DB_PASSWORD: root }

  mariadb:
    name: Tests on MariaDB 11.4
    needs: gate
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.tests == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45  # the site suite takes about 30 minutes on a busy runner, like on MySQL
    services:
      db:
        image: mariadb:11.4
        env: { MARIADB_ROOT_PASSWORD: root }
        ports: ['3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/php-composer
      - name: More connections (the default 151 runs out with parallel whole-site tests)
        run: php -r '(new PDO("mysql:host=127.0.0.1;port=" . getenv("TALEA_TEST_DB_PORT"), "root", "root"))->exec("SET GLOBAL max_connections = 1000");'
        env: { TALEA_TEST_DB_PORT: "${{ job.services.db.ports['3306'] }}" }
      - name: PHPUnit (integration and whole installed sites)
        run: vendor/bin/paratest --processes 4 --testsuite integration,site
        env: { TALEA_TEST_DB_HOST: 127.0.0.1, TALEA_TEST_DB_PORT: "${{ job.services.db.ports['3306'] }}", TALEA_TEST_DB_USER: root, TALEA_TEST_DB_PASSWORD: root }

  postgres:
    name: Tests on PostgreSQL 18
    needs: gate
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.tests == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    services:
      db:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432']
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/php-composer
      - name: PHPUnit (integration and whole installed sites)
        run: vendor/bin/paratest --processes 4 --testsuite integration,site
        env: { TALEA_TEST_DB_DRIVER: pgsql, TALEA_CI_NETWORK: "${{ job.services.db.network }}", TALEA_TEST_PG_HOST: db, TALEA_TEST_PG_PORT: 5432, TALEA_TEST_PG_USER: postgres, TALEA_TEST_PG_PASSWORD: postgres }

  browser:
    name: Browser walk (Chrome)
    needs: gate
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.tests == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    services:
      db:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root }
        ports: ['3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/php-composer
      - name: Admin, builder, editors and public site in Chrome
        # Chromium and Node live in the ci image (.github/actions/php-composer): the path is the one inside the container
        run: vendor/bin/phpunit --testsuite browser
        env: { CHROME: /usr/bin/chromium, TALEA_CI_NETWORK: "${{ job.services.db.network }}", TALEA_TEST_DB_HOST: db, TALEA_TEST_DB_PORT: 3306, TALEA_TEST_DB_USER: root, TALEA_TEST_DB_PASSWORD: root }

  phpstan:
    # static analysis (phpstan.neon.dist): level 5, the existing findings in phpstan-baseline.neon - new code adds none
    name: Static analysis
    needs: gate
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.tests == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/php-composer
      - name: PHPStan
        run: |
          # RUNNER_TEMP, not /tmp: PHP runs in a container that sees only the workspace and RUNNER_TEMP
          curl -sSL -o "$RUNNER_TEMP/phpstan.phar" https://github.com/phpstan/phpstan/releases/download/2.1.30/phpstan.phar
          # two worker processes, not one per CPU: each worker can take as much memory as the main process, and together they ran
          # the shared runner host out of memory; one process needs about 500 MB, so two fit the container's cap (php-composer)
          printf 'includes:\n    - %s/phpstan.neon.dist\nparameters:\n    parallel:\n        maximumNumberOfProcesses: 2\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/phpstan-ci.neon"
          php "$RUNNER_TEMP/phpstan.phar" analyse -c "$RUNNER_TEMP/phpstan-ci.neon" --no-progress

  security:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: Semgrep - security rules for PHP and JavaScript
        # run the tool directly in a container: the deprecated semgrep-action can no longer read the current registry rules
        run: docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep semgrep scan --config p/php --config p/javascript --config p/secrets --config p/owasp-top-ten --error --metrics=off --quiet
      - name: Gitleaks - no keys or passwords in the repository
        # run the tool directly: the gitleaks-action wrapper needs a paid licence for organisations
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source /repo --redact --no-banner --verbose
      - name: The publisher's private key is not in git
        run: '! git ls-files | grep -E "tools/keys|\.key$"'
