# PHP and Composer for the self-hosted runners, inside Docker. Nothing is installed on the runner host itself.
# Why: setup-php installed PHP onto the host that two runners share. Parallel jobs rewrote each other's Composer
# ('Class "Composer\Util\PackageSorter" not found in phar://…', a tool cache saying "installed" for a missing file), and then a PHP
# release built against another system broke every job ("php: error while loading shared libraries: libxml2.so.2").
# How: the step builds the Dockerfile's "ci" stage (PHP with the image's extensions, Composer, Chromium, Node) and writes two small
# wrapper scripts, php and composer, into a directory on the job's PATH. Each wrapper runs the tool in a fresh container of that
# image: the runner's user, the host network (services such as MySQL answer on 127.0.0.1:<mapped port>), the workspace and
# RUNNER_TEMP mounted at the same paths, the working directory kept, and the TALEA_*, CHROME and CI variables passed through.
# The image is addressed by its ID, never a shared tag, so jobs on the same host do not swap each other's image.
# `vendor/bin/paratest` and friends start with `#!/usr/bin/env php`, which finds the wrapper; everything they start (PHP's built-in
# server, node, Chromium) runs inside the same container.
name: PHP and Composer
description: Runs PHP and Composer in the Dockerfile's ci stage on a self-hosted runner and installs the dependencies
inputs:
  install:
    description: Run composer install ('false' for jobs that only need PHP)
    default: 'true'
runs:
  using: composite
  steps:
    - name: PHP in Docker (image built from the ci stage, php and composer wrappers on PATH)
      shell: bash
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/php-in-docker"
        cache="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/talea-composer-cache"
        mkdir -p "$bin" "$cache"
        # with buildx the image must be loaded into Docker explicitly; the classic builder has no --load
        load=(); docker buildx version >/dev/null 2>&1 && load=(--load)
        DOCKER_BUILDKIT=1 docker build --quiet "${load[@]}" --iidfile "$bin/image" --target ci . >/dev/null
        image=$(cat "$bin/image")
        for tool in php composer; do
          cat > "$bin/$tool" <<EOF
        #!/usr/bin/env bash
        env=()
        for name in \$(compgen -e); do [[ \$name =~ ^(TALEA_.*|CHROME|CI)\$ ]] && env+=(-e "\$name"); done
        exec docker run --rm -i --init --network host --shm-size 1g -u $(id -u):$(id -g) \\
          -e HOME=/tmp -e COMPOSER_HOME=/tmp/composer -e COMPOSER_CACHE_DIR=/composer-cache "\${env[@]}" \\
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -v "$cache:/composer-cache" \\
          -w "\$PWD" --entrypoint $tool $image "\$@"
        EOF
          chmod +x "$bin/$tool"
        done
        echo "$bin" >> "$GITHUB_PATH"
        "$bin/php" -v
    - name: Composer install (retried)
      if: inputs.install == 'true'
      shell: bash
      run: |
        set -euo pipefail
        composer --version
        for attempt in 1 2 3; do
          if composer install --no-interaction --no-progress --prefer-dist; then exit 0; fi
          echo "::warning::composer install failed (attempt $attempt of 3)"
          sleep $((attempt * 10))
        done
        exit 1
