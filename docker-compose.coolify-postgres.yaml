# Talea + PostgreSQL 18 on Coolify: new resource -> Docker Compose (build pack), compose file /docker-compose.coolify-postgres.yaml.
# The same with MySQL: docker-compose.coolify-mysql.yaml, with MariaDB: docker-compose.coolify-mariadb.yaml.
# Coolify fills the SERVICE_* magic variables: the domain (set it on the web service, port 8080), the database password and the
# site's secret (TALEA_SECRET_KEY; keep it with your backups, see docs/DEPLOYMENT.md).
# Optional: add TALEA_AI_URL (or any variable from docker/README.md) in the Environment Variables tab; TALEA_TAG pins a version (1.4.2, 1.4).

services:
  web:
    image: ghcr.io/czepter/talea:${TALEA_TAG:-latest}
    restart: unless-stopped
    expose: ["8080"]
    environment:
      - SERVICE_FQDN_WEB_8080
      - TALEA_SITE_URL=${SERVICE_URL_WEB}
      - TALEA_DB_DRIVER=pgsql
      - TALEA_DB_HOST=db
      - TALEA_DB_NAME=talea
      - TALEA_DB_USER=${SERVICE_USER_DB}
      - TALEA_DB_PASSWORD=${SERVICE_PASSWORD_DB}
      - TALEA_AI_URL=${TALEA_AI_URL:-}
      - TALEA_SECRET_KEY=${SERVICE_PASSWORD_64_SECRET}
    volumes:
      - storage:/app/storage
      - media:/app/media
      - extensions:/app/extensions
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_DB=talea
      - POSTGRES_USER=${SERVICE_USER_DB}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_DB}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 20

volumes:
  db:
  storage:
  media:
  extensions:
